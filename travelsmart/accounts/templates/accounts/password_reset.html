{% extends 'base.html' %}
{% block content %}
<div class="form-container">
  <div class="form-card">
    <h2 class="auth-title">Reset Your Password</h2>
    <p>Enter your email and we'll send you instructions to reset your password.</p>
    <form method="post">
      {% csrf_token %}
      <div class="auth-field">
        <label for="id_email">Email:</label>
        <input id="id_email" type="email" name="email" required placeholder="Enter your email">
      </div>
      <button type="submit" class="btn full-width">Send Reset Email</button>
    </form>
  </div>
</div>
{% endblock %}
