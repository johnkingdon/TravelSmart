{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2 class="auth-title">Account Settings</h2>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="form-error">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn full-width">Update Info</button>
        </form>
    </div>
</div>
{% endblock %}
