{% extends 'base.html' %}
{% block content %}
<div class="form-container">
  <div class="form-card">
    <h2 class="auth-title">Enter New Password</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          {{ field.label_tag }}
          {{ field }}
          {% for error in field.errors %}
            <div class="form-error">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="cta-button full-width">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
