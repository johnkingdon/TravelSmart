<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelSmart | Plan Smarter, Travel Better</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% load static %}
  <link rel="stylesheet" href="{% static 'main/style.css' %}?v=2">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="page-container">
    <header>
      <nav class="navbar">
        <a href="{% url 'homepage' %}" class="logo">
          <img src="{% static 'main/logo.png' %}" alt="TravelSmart Logo">
          <span class="logo-text">TravelSmart</span>
        </a>

        <div class="auth-buttons">
          {% if user.is_authenticated %}
            <div class="user-info">
              <span class="user-name">{{ user.username }}</span>

            <!-- DEBUG: {{ has_unseen_announcements }} -->
              <!-- 🔔 Bell Icon (Authenticated User) -->
              <a href="{% url 'announcements' %}" class="nav-icon">
                <img src="{% static 'main/bell.png' %}" alt="Announcements" class="bell-icon">
                {% if has_unseen_announcements %}
                  <span class="notification-dot"></span>
                {% endif %}
              </a>

              <a href="{% url 'accounts.settings' %}" class="btn">Account Settings</a>

              <form method="post" action="{% url 'accounts.logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn">Logout</button>
              </form>
            </div>
          {% else %}
            <!-- 🔔 Bell Icon (Unauthenticated User) -->
            <a href="{% url 'accounts.login' %}" class="nav-icon">
              <img src="{% static 'main/bell.png' %}" alt="Announcements" class="bell-icon">
            </a>

            <a href="{% url 'accounts.login' %}" class="btn">Login</a>
            <a href="{% url 'accounts.signup' %}" class="btn primary">Create Account</a>
          {% endif %}
        </div>
      </nav>
    </header>

    <main class="content-wrap">
      {% block content %}{% endblock %}
    </main>

  </div>

  <div id="custom-infobox" class="hidden">
    <div id="custom-infobox-content"></div>
  </div>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
