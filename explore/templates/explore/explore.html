{% extends 'base.html' %}
{% load static %}

{% block content %}
  <link rel="stylesheet" href="{% static 'explore/explore.css' %}">
  <link rel="stylesheet" href="{% static 'explore/itinerary.css' %}">

  <div class="explore-container">
    <div class="sidebar">
      <h2 class="sidebar-title">Explore Attractions</h2>
      <form id="explore-form">
        <input type="text" id="autocomplete" name="destination" class="explore-input" placeholder="Enter a destination...">
       <select name="category" class="styled-dropdown">
          <option value="">All Categories</option>
          <option value="food">🍽️ Restaurants</option>
          <option value="cafes">☕ Cafes</option>
          <option value="nightlife">🍸 Nightlife</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="museums">🏛️ Museums</option>
          <option value="parks">🌳 Parks</option>
          <option value="art">🖼️ Art Galleries</option>
          <option value="hotels">🛏️ Hotels</option>
          <option value="attractions">📸 Attractions</option>
          <option value="religion">⛪ Churches</option>
          <option value="entertainment">🎬 Movie Theaters</option>
        </select>
        <select id="price-filter" name="price_filter" class="explore-input">
            <option value="">Any Price</option>
            <option value="1">Affordable</option>
            <option value="2">Mid-Range Options</option>
            <option value="3">Upscale Experiences</option>
            <option value="4">Luxury</option>
        </select>
        <button type="submit" class="btn">Search</button>
      </form>
      <div id="results" class="results-scroll"></div>
    </div>

    <div id="map" class="explore-map"></div>

    <div id="modal-backdrop" class="hidden"></div>

    <div id="place-modal" class="modal hidden">
      <div class="modal-content">
        <span id="close-modal" class="close">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-address"></p>
        <p id="modal-rating"></p>
        <p id="modal-price"></p>
        <a id="modal-website" href="#" target="_blank" class="btn btn-visit hidden">Visit Website</a>
        <div id="modal-photos">
          <img id="modal-photo-img" src="" alt="Place photo" style="border-radius: 12px; width: 100%; max-width: 500px; display: none;">
          <div class="photo-nav">
            <button id="prev-photo" class="btn">Previous</button>
            <button id="next-photo" class="btn">Next</button>
          </div>
        </div>
        <div id="modal-reviews"></div>
      </div>
    </div>

    <div id="itinerary" class="itinerary-panel">
      <h2 class="itinerary-title">My Itinerary</h2>
      <div id="itinerary-list" class="itinerary-list">
        <p class="empty-text">Drag destinations here</p>
      </div>
      <div id="itinerary-trash" class="itinerary-trash" title="Drop here to remove">🗑️</div>
    </div>

  </div>

{% endblock %}

{% block extra_scripts %}
  <script src="{% static 'explore/explore.js' %}"></script>
  <script src="{% static 'explore/itinerary.js' %}"></script>
  <script
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDF4ATm4jiTrHA8uB8b5AG9Q-84OsOzoBU&libraries=places&callback=initMap"
  ></script>
{% endblock %}
